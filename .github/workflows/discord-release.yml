name: Announce release on Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to announce (updates its post, for testing)
        required: true
        type: string
      dry_run:
        description: Print the payload instead of posting it
        required: false
        default: false
        type: boolean

# The post is edited in place from then on by the hourly statistics run, so this workflow writes the
# message id it posts back to the `stats` branch — the same place the readings live, and never the
# working branch.
permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_WEBHOOK: ${{ secrets.RELEASE_WEBHOOK }}
    steps:
      # Pinned to the default branch rather than the released tag: a release event otherwise checks
      # out the tag, whose older copy of the script would post a payload the hourly refresh cannot
      # keep in step with.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # The post is built and published by the statistics tooling, which also refreshes it hourly:
      # the download total sits in the same message as the download button, so they need one builder
      # rather than two that drift apart.
      - name: Publish the release post
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          options=(--release "${TAG}")
          if [ "${DRY_RUN}" = "true" ]; then
            options+=(--dry-run)
          fi
          node scripts/statistics.mjs "${options[@]}"
